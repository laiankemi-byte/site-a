<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站A - 创建账号录入信息</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      width: 100%;
      max-width: 500px;
    }
    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    #status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .nav-link {
      display: inline-block;
      margin-top: 24px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .divider {
      border: none;
      border-top: 1px solid #e1e5e9;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>创建账号并录入信息</h1>
    <p class="subtitle">在这里创建你的账号，并录入需要保存的信息</p>

    <label for="username">账号名</label>
    <input id="username" type="text" placeholder="请输入账号名（例如：zhangsan）" />

    <label for="info">录入信息</label>
    <textarea id="info" placeholder="请输入你要保存的信息内容..."></textarea>

    <button id="saveBtn">保存到数据库</button>

    <div id="status"></div>

    <hr class="divider" />

    <a href="index.html" class="nav-link">前往网站B - 查询账号信息 →</a>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://hkejbjmgkqxjjmgrxtuj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZWpiam1na3F4amptZ3J4dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDQ3NTEsImV4cCI6MjEwNzM4MDc1MX0.TfJCm31vKy9wEIMnbrlcLUh5_Ydzvx1Rxn7YgKSIN1U'
    );

    const statusEl = document.getElementById('status');

    document.getElementById('saveBtn').onclick = async () => {
      const username = document.getElementById('username').value.trim();
      const info = document.getElementById('info').value.trim();

      if (!username || !info) {
        statusEl.className = 'error';
        statusEl.textContent = '账号名和信息不能为空，请检查后重试。';
        return;
      }

      const { data, error } = await supabase
        .from('user_infos')
        .insert({ username, info })
        .select()
        .single();

      if (error) {
        statusEl.className = 'error';
        statusEl.textContent = '保存失败：' + error.message;
      } else {
        statusEl.className = 'success';
        statusEl.textContent = '保存成功！账号：' + data.username + '，信息已存入数据库。';
        document.getElementById('info').value = '';
      }
    };
  </script>
</body>
</html>
